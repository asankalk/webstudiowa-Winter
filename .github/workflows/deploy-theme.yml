name: Deploy Winter Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Approved RH-25 operation
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - deploy
      confirm_production:
        description: Type DEPLOY only after the dry run and production approval
        required: false
        default: ''
        type: string

permissions:
  contents: read

# A main push validates only. Remote access additionally needs manual dispatch,
# the production environment, and the repository rollout variable below.
# Do not enable the rollout variable until target metadata and the production
# environment's required reviewer protections have been independently verified.

concurrency:
  group: winter-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Theme
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build compiled assets
        run: npm run build

      - name: Check PHP and JavaScript syntax
        run: |
          find . -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/main.js
          bash -n tools/deploy-rh25.sh tests/deploy-rh25.sh
          bash tests/deploy-rh25.sh
          git diff --check

      - name: Install responsive test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Audit published pages with candidate assets
        env:
          AUDIT_OUTPUT: /tmp/wswa-responsive
        run: |
          npm run test:responsive -- --local
          npm run test:navigation -- --local
          npm run test:portfolio -- --local

      - name: Preserve responsive audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit
          path: /tmp/wswa-responsive

      - name: Validate required theme files
        run: |
          test -f style.css
          test -f functions.php
          test -f package.json
          test -d assets
          test -d inc
          test -d template-parts

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.WSWA_RH25_TARGET_APPROVED == 'true' &&
      (inputs.operation == 'dry-run' ||
       (inputs.operation == 'deploy' && inputs.confirm_production == 'DEPLOY'))
    name: Approved RH-25 Operation
    runs-on: ubuntu-latest
    needs: build
    environment: production
    env:
      LIVE_HOST: ${{ secrets.LIVE_HOST }}
      LIVE_PORT: ${{ secrets.LIVE_PORT }}
      LIVE_USER: ${{ secrets.LIVE_USER }}
      LIVE_THEME_PATH: ${{ secrets.LIVE_THEME_PATH }}
      LIVE_KNOWN_HOSTS: ${{ secrets.LIVE_KNOWN_HOSTS }}
      DEPLOY_OPERATION: ${{ inputs.operation }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build compiled assets
        run: npm run build

      - name: Validate approved RH-25 configuration without remote access
        run: bash tools/deploy-rh25.sh validate

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LIVE_SSH_KEY }}

      - name: Verify remote identity and perform the approved operation
        shell: bash
        run: |
          set -euo pipefail
          bash tools/deploy-rh25.sh execute | tee "$RUNNER_TEMP/rh25-operation.txt"

      - name: Preserve non-secret operation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh25-operation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rh25-operation.txt
          if-no-files-found: ignore
