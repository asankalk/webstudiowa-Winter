name: Deploy Winter Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Deployment notes:
# - This workflow is designed for SSH + rsync deployment, not FTP/FTPS.
# - All credentials and connection details must be provided through GitHub Secrets.
# - Store the confirmed live theme path in LIVE_THEME_PATH rather than hardcoding it here.
# - Do not commit server passwords, SSH private keys, or other secrets to the repository.
# - The rsync --delete flag can remove files on the live server that no longer exist in Git.
# - Back up the live theme directory before the first automated deployment.

concurrency:
  group: winter-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Theme
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build compiled assets
        run: npm run build

      - name: Check PHP and JavaScript syntax
        run: |
          find . -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/main.js
          git diff --check

      - name: Install responsive test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Audit published pages with candidate assets
        env:
          AUDIT_OUTPUT: /tmp/wswa-responsive
        run: |
          npm run test:responsive -- --local
          npm run test:navigation -- --local

      - name: Preserve responsive audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit
          path: /tmp/wswa-responsive

      - name: Validate required theme files
        run: |
          test -f style.css
          test -f functions.php
          test -f package.json
          test -d assets
          test -d inc
          test -d template-parts

  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy To Live Server
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build compiled assets
        run: npm run build

      - name: Validate deployment path secret
        run: test -n "${{ secrets.LIVE_THEME_PATH }}"

      - name: Confirm deployment secrets are configured
        run: |
          test -n "${{ secrets.LIVE_HOST }}"
          test -n "${{ secrets.LIVE_PORT }}"
          test -n "${{ secrets.LIVE_USER }}"
          test -n "${{ secrets.LIVE_SSH_KEY }}"
          test -n "${{ secrets.LIVE_THEME_PATH }}"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LIVE_SSH_KEY }}

      - name: Add server host key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${{ secrets.LIVE_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.LIVE_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${{ secrets.LIVE_PORT }}" -H "${{ secrets.LIVE_HOST }}" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy theme via rsync over SSH
        shell: bash
        env:
          LIVE_HOST: ${{ secrets.LIVE_HOST }}
          LIVE_PORT: ${{ secrets.LIVE_PORT }}
          LIVE_USER: ${{ secrets.LIVE_USER }}
          LIVE_THEME_PATH: ${{ secrets.LIVE_THEME_PATH }}
        run: |
          # Fail closed unless the exact theme path exists and a verified snapshot is saved.
          ssh -p "${LIVE_PORT}" "${LIVE_USER}@${LIVE_HOST}" bash -s -- "${LIVE_THEME_PATH}" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" <<'REMOTE'
          set -eu
          theme_path="${1%/}"
          test "$(basename "$theme_path")" = winter
          test -f "$theme_path/style.css"
          test -f "$theme_path/functions.php"
          backup_root="$HOME/winter-deploy-backups"
          mkdir -p "$backup_root"
          chmod 700 "$backup_root"
          backup_path="$backup_root/winter-$2.tar.gz"
          test ! -e "$backup_path"
          tar -czf "$backup_path" -C "$(dirname "$theme_path")" "$(basename "$theme_path")"
          tar -tzf "$backup_path" >/dev/null
          sha256sum "$backup_path"
          echo "Verified pre-deploy theme backup: winter-$2.tar.gz"
          REMOTE
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.DS_Store' \
            --exclude='*.log' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='backups/' \
            --exclude='backup/' \
            --exclude='*.sql' \
            --exclude='*.zip' \
            --exclude='*.tar' \
            --exclude='*.tar.gz' \
            --exclude='*.tgz' \
            --exclude='README.md' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='tools/' \
            --exclude='package-lock.json' \
            --exclude='package.json' \
            --exclude='assets/scss/' \
            -e "ssh -p ${LIVE_PORT}" \
            ./ "${LIVE_USER}@${LIVE_HOST}:${LIVE_THEME_PATH}"
